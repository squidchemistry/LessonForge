# Render Blueprint: one free web service that serves both the API and the built React UI.
# The free plan has no persistent disk, so set DATABASE_URL (free Neon Postgres) to keep lessons
# across restarts/redeploys. Without it, lessons are stored on the ephemeral disk and are lost.
# The instance also sleeps after ~15 min idle (first request afterwards is slow).
services:
  - type: web
    name: lessonforge
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: GEMINI_MODELS
        value: gemini-3.5-flash,gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
